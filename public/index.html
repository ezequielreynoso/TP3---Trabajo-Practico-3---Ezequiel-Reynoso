<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Agregar libro</title>
</head>

<body>

    <h1>Agregar libro</h1>

    <form action="/libros" method="POST">

        <div>
            <label for="titulo">Título:</label>
            <input
                type="text"
                id="titulo"
                name="titulo"
                required
            >
        </div>

        <br>

        <div>
            <label for="autor">Autor:</label>
            <input
                type="text"
                id="autor"
                name="autor"
                required
            >
        </div>

        <br>

        <div>
           <label for="anio">Año:</label>
            <input
                type="number"
                id="anio"
                name="anio"
                required
            >
        </div>

        <br>

        <button type="submit">
            Agregar libro
        </button>

    </form>

</body>

</html>
